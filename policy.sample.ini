[rdns]
FailOnMissingPTR = yes

[caa]
RequireIssue = yes
RequireIodef = yes

# Comma-separated list of allowed iodef addresses (email addresses or URLs)
# Leave empty or comment out to allow any valid iodef address
IodefAllowlist = security@example.com,mailto:incident@example.com,https://example.com/security

[mail]
RequireSPF = yes
RequireDMARC = yes
